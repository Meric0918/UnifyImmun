paths:
  project_root: ..
  data_root: ../data
  cache_root: ../embedding_cache/plm_stage1
  output_root: ../trained_model/PLM_Unified
  swanlog_root: ../swanlog
  esmc_model: /home/mjp/model/ESMC-300M
  tcr_bert_model: /home/mjp/model/TCR-Bert

model:
  peptide_input_dim: 960
  hla_input_dim: 960
  tcr_input_dim: 768
  adapter_hidden_dim: 256
  model_dim: 128
  num_attention_heads: 4
  feedforward_dim: 512
  adapter_dropout: 0.1
  attention_dropout: 0.1
  classifier_dropout: 0.2
  peptide_min_length: 8
  peptide_max_length: 15
  hla_max_length: 34
  tcr_max_length: 34

training:
  fold: 1
  seed: 42
  seeds: [42, 3407, 2026]
  num_workers: 2
  threshold: 0.5
  pin_memory: true
  persistent_workers: false
  device: auto

stage2:
  micro_batch_size: 8
  eval_batch_size: 64
  gradient_accumulation_steps: 16
  stage2a_rounds: 2
  stage2b_min_rounds: 5
  stage2b_max_rounds: 20
  early_stopping_patience: 5
  early_stopping_min_delta: 0.0001
  peptide_unfrozen_layers: 2
  hla_unfrozen_layers: 2
  tcr_unfrozen_layers: 2
  peptide_top_lr: 0.00001
  peptide_lower_lr: 0.000005
  hla_top_lr: 0.00001
  tcr_top_lr: 0.00001
  tcr_lower_lr: 0.000005
  adapter_lr: 0.00005
  cross_attention_lr: 0.0001
  pooling_lr: 0.0001
  classifier_lr: 0.0001
  weight_decay: 0.01
  scheduler_warmup_ratio: 0.05
  gradient_clip_norm: 1.0
  mixed_precision: bf16
  gradient_checkpointing: true
  log_every_optimizer_steps: 1

swanlab:
  project: unifyimmun
  workspace: null
  mode: online
  group: plm-stage2-fold{fold}
  experiment_prefix: PLM-Stage2
  tags: [ESMC-300M, TCR-BERT, partial-unfreeze, stage2, unified]
